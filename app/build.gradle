plugins {
    id 'com.android.application'
}

android {
    namespace 'com.derstv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.derstv.app'
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName '2.0'
    }

    // Her derlemede aynı anahtar kullanılsın ki güncellemeler eski sürümün üzerine kurulabilsin
    // (yoksa her güncellemede uygulamayı silip yeniden giriş yapmanız gerekir).
    signingConfigs {
        shared {
            storeFile file('derstv.keystore')
            storePassword 'derstv123'
            keyAlias 'derstv'
            keyPassword 'derstv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
