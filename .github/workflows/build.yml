name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Simge, afis ve imza anahtarini hazirla
        run: |
          pip install --quiet pillow
          python3 tools/make_icons.py
          echo '' | base64 -d > app/derstv.keystore

      - name: APK olustur
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: UdemyFans-apk
          path: app/build/outputs/apk/release/*.apk

      - name: APK'yi Releases sayfasinda yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk UdemyFans.apk
          gh release create "v${{ github.run_number }}" UdemyFans.apk --title "Udemy Fans (derleme ${{ github.run_number }})" --notes "Otomatik derleme. UdemyFans.apk dosyasini indirip TV'ye kurun." --latest
